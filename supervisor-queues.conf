# Supervisor configuration for Laravel Queue Workers
# Place this file in /etc/supervisor/conf.d/laravel-queues.conf

[program:laravel-sync-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan queue:work database --queue=sync --timeout=600 --tries=3 --sleep=3 --tries=3 --max-time=3600
directory=/path/to/your/project
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/path/to/your/project/storage/logs/sync-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:laravel-tagging-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan queue:work database --queue=tagging --timeout=300 --tries=2 --sleep=1 --max-time=3600
directory=/path/to/your/project
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=3
redirect_stderr=true
stdout_logfile=/path/to/your/project/storage/logs/tagging-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

# Optional: High priority queue for critical jobs
[program:laravel-high-priority-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/your/project/artisan queue:work database --queue=high,sync,tagging --timeout=300 --tries=3 --sleep=1 --max-time=3600
directory=/path/to/your/project
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/your/project/storage/logs/high-priority-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
